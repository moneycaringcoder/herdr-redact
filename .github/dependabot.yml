# The crate has a handful of direct dependencies and no network surface, so
# updates are grouped into a single monthly pull request rather than arriving
# one at a time. `regex` is the one worth reading the changelog for: it parses
# patterns supplied by users and runs them over arbitrary terminal output.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
