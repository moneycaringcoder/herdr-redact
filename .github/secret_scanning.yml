# Paths excluded from GitHub secret scanning and push protection.
#
# This repository is a secret scanner. Its test corpus has to contain strings
# that look exactly like real credentials, because that is the thing under test:
# tests/scan_corpus.rs holds one entry per detection rule, and tests/never_leaks.rs
# asserts that a finding never carries its own secret into a rendered pane.
#
# Every value in those files is synthetic — AWS's published AKIAIOSFODNN7EXAMPLE,
# sequential 0123456789abcdef filler, and EXAMPLE padding — and none of it opens
# anything. Without this exclusion, GitHub push protection blocks every push that
# touches a fixture, and secret scanning raises a permanent set of alerts that are
# all false. On a security repository that is worse than useless: it trains the
# maintainer to dismiss the alert list, which is where a real leak would appear.
#
# This narrows scanning, it does not disable it. Everything outside tests/ is
# still scanned and still push-protected, which is where a real credential would
# realistically land.
paths-ignore:
  - "tests/**"
