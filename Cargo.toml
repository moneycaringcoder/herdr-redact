[package]
name = "redact"
version = "0.1.1"
edition = "2021"
description = "Warns when an agent pane has printed a credential, before you screenshot or paste it."
license = "MIT"
repository = "https://github.com/moneycaringcoder/herdr-redact"

# The binary target inherits the package name => target/release/redact, which is
# what every command in herdr-plugin.toml points at.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# User-supplied `patterns` and `allowlist` are regexes, and so are several of the
# built-in provider rules. `regex` is pure Rust, has no network behaviour, and
# guarantees linear-time matching — which matters when the input is somebody
# else's terminal output.
regex = "1"
# Terminal column widths. Hand-rolling this was tried and was wrong in six ways
# a reviewer found in one sitting — emoji outside the 1F300 block measured one
# column, skin-tone modifiers and ZWJ sequences measured four and six, Hebrew
# points and Thai vowel signs measured one instead of zero. Every one of those
# breaks the promise that no rendered line exceeds the width it was given.
unicode-width = "0.2.2"

# The schema oracle needs `regex` to honor JSON Schema's `pattern` keyword. It
# is already a runtime dependency, so naming it here adds no package to the
# lockfile. A schema-validation crate was rejected: even the smallest candidate
# tripled the package count, adding 45 crates including the ICU stack, for a
# test-only oracle.
[dev-dependencies]
regex = "1"

# Unix-only: setsid for daemon detachment, and SIGINT/SIGTERM shutdown plumbing.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bench]]
name = "scan_cost"
harness = false
