<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="redact">
  <title>redact</title>
  <!--
    A pane, a prompt, and one line of output with its middle struck out: four
    characters, a redaction, four characters — which is exactly what a preview
    from this plugin looks like, and the only shape of a credential it will ever
    show you.

    Geometry only, no text: it stays legible at 24 pixels and needs no font.
    Mid-tone grey on purpose, so one file reads on light and dark backgrounds,
    with the single red bar as the only accent.
  -->
  <g fill="none" stroke="#8b949e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="10" y="22" width="108" height="84" rx="12"/>
    <path d="M26 44 l11 9 -11 9"/>
  </g>
  <g fill="#8b949e">
    <rect x="48" y="48" width="46" height="10" rx="5"/>
    <rect x="26" y="76" width="18" height="10" rx="5"/>
    <rect x="84" y="76" width="18" height="10" rx="5"/>
  </g>
  <rect x="50" y="76" width="28" height="10" rx="5" fill="#ff8080"/>
</svg>
